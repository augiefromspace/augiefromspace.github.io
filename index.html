<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Augiefrom.space</title>
<style>
  /* Reset & basic styling */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: radial-gradient(circle at top, #0b0c10, #1f2833); color: #c5c6c7; line-height: 1.6; }
  a { color: #66fcf1; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Container */
  .container { max-width: 900px; margin: 0 auto; padding: 2rem; }

  /* Hero */
  .hero { text-align: center; padding: 4rem 1rem; }
  .hero h1 { font-size: 3rem; color: #45a29e; }
  .hero p { margin-top: 1rem; font-size: 1.2rem; color: #66fcf1; }

  /* About */
  .about { margin: 4rem 0; text-align: center; }
  .about p { font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

  /* Projects */
  .projects { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; margin-bottom: 4rem; }
  .project-card { background: #1f2833; padding: 1rem; border-radius: 12px; width: 250px; text-align: center; transition: transform 0.2s; }
  .project-card:hover { transform: translateY(-5px); }
  .project-card img { width: 100%; border-radius: 8px; }
  .project-card h3 { margin: 0.5rem 0; color: #45a29e; }
  .project-card p { font-size: 0.9rem; color: #c5c6c7; }

  /* Contact */
  .contact { text-align: center; margin-bottom: 2rem; }
  .socials { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1rem; }
  .socials a { font-size: 1.5rem; }

  /* Footer */
  footer { text-align: center; padding: 1rem 0; border-top: 1px solid #45a29e; font-size: 0.9rem; color: #66fcf1; }

  @media (max-width: 600px) {
    .projects { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Hero -->
  <section class="hero">
    <h1>Augie. Rockets. Chaos.</h1>
    <p>Exploring the skies, one launch at a time 🚀</p>
  </section>

  <!-- About -->
  <section class="about">
    <p>I tinker with rockets, design cool parts, and make things fly. Also, a small dog king exists 🐶.</p>
  </section>

  <!-- Contact -->
  <section class="contact">
    <p>Follow the chaos or say hi:</p>
    <div class="socials">
      <a href="https://youtube.com/@chihuahualandinc" target="_blank">Youtube!</a>
    </div>
  </section>

</div>

<!-- Footer -->
<footer>
  © 2026 Augiefrom.space
</footer>
</body>
</html>
