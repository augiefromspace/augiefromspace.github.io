<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infill Aerospace | Amateur Rocketry</title>
    
    <!-- Importing Squada One from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Squada+One&display=swap" rel="stylesheet">

    <style>
        /* Modern CSS Reset & Dark Mode Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0b0f19;
            --accent-color: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            
            /* Font variables */
            --font-display: 'Squada One', sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(56, 189, 248, 0.03), transparent 40%);
        }

        /* Header / Logo Section */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem 2rem 1.5rem 2rem;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .logo-container img {
            max-height: 140px;
            width: auto;
            display: block;
        }

        /* Text fallback for logo using Squada One */
        .logo-fallback {
            font-family: var(--font-display);
            font-size: 2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo-container img:not([src]), .logo-container img[src=""] {
            display: none;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .badge {
            font-family: var(--font-display);
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 0.4rem 1.2rem;
            border-radius: 4px; /* Squared edges match the font better than round */
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 5rem; /* Squada One looks great big */
            font-weight: 400; /* Custom display fonts usually have set weights */
            color: #fff;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
        }

        h1 span {
            color: var(--accent-color);
        }

        .tagline {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 550px;
            margin-bottom: 2.5rem;
        }

        /* Status Bar */
        .status-container {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            background: rgba(30, 41, 59, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .tagline { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Infill Aerospace Logo">
            <!-- If logo.png is missing or loading, this displays in Squada One instead -->
        </div>
    </header>

    <main>
        <div class="badge">Amateur Rocketry</div>
        
        <h1>Infill <span>Aerospace</span></h1>
        
        <p class="tagline">Next-generation hardware and flight telemetry tracking. The full site is currently under construction.</p>
        
        <div class="status-container">
            <div class="pulse-dot"></div>
            <span>System status: T-minus dynamic development (Coming Soon)</span>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Infill Aerospace (formerly Delta Aerospace Systems). All rights reserved.</p>
    </footer>

</body>
</html>
